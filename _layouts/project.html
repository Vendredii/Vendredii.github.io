---
layout: default
---
<section class="prose">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="position">{{ page.summary }}</p>{% endif %}
    {% if page.image %}
    <figure class="hero">
        <img src="{{ page.image | relative_url }}" alt="">
    </figure>
    {% endif %}
    {{ content }}
</section>
