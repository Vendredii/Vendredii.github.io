---
layout: default
---
<section class="prose">
    <p class="card-date">{{ page.date | date: "%-d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="position">{{ page.summary }}</p>{% endif %}
    {% if page.image %}
    <figure class="hero">
        <img src="{{ page.image | relative_url }}" alt="{{ page.image_caption | default: '' }}">
        {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
    </figure>
    {% endif %}
    {{ content }}
    <p class="links"><a href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
</section>
