# Site-wide settings. Jekyll does NOT reload this file while `jekyll serve`
# is running; restart the server after editing it.
#
# Page content does not live here. Edit the files in _data/, _news/ and _projects/.

url: "https://vendredii.github.io"
baseurl: ""
markdown: kramdown

# Every Markdown file in _projects/ becomes its own page at /projects/<file-name>/.
collections:
  projects:
    output: true
    permalink: /projects/:name/
  # Every Markdown file in _news/ becomes its own page at /news/<year>/<file-name>/.
  news:
    output: true
    permalink: /news/:year/:title/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: news
    values:
      layout: news_post

exclude:
  - README.md
  - template-backup.zip
  - .claude
  - assets/images/profile.png   # full-size original; the site uses profile.jpg
