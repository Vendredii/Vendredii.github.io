# Markdown is allowed. Leave a blank line between paragraphs.
bio: |
  As a plant ecologist, I am working on how global change affects plants and
  terrestrial ecosystems. I study how functional traits respond to global
  change, drought in particular, across levels of organisation from
  individuals to communities. I also try to understand the mechanisms by
  which plants and soil persist as an integrated system under global change,
  and how we might apply those mechanisms to protect our beautiful planet.

  My PhD project is part of the
  [BioCliVE](https://www.uu.nl/en/research/ecology-and-biodiversity/research/uu-bioclive)
  and [Ecotron](https://www.npec.nl/phenotyping-modules/module-1-ecotron/)
  experiments. In it, I moved from species richness to functional traits, and
  from communities to species to the globe, to understand
  biodiversity–ecosystem functioning (BEF) relationships under stress, and the
  relationship between plant strategies and species distributions. Under soil
  and air drought, plant species richness reduced soil water loss and
  increased aboveground biomass, but richness alone did not explain these
  effects. Functional traits helped to explain them: the mixture advantage was
  associated with the functional composition of communities, which in turn
  reflected the growing dominance of a single species in the presence of
  others. Above- and belowground responses were only partly coupled, both
  within experimental communities and across global climatic gradients.
  Together, these findings show that understanding how diversity affects
  ecosystem functioning under drought requires knowing not only how many
  species a community contains, but also which species they are, and how they
  interact with their neighbours. Uncovering the mechanisms that determine
  which species become dominant is the next step towards predicting how plant
  communities will assemble and function under climate change, and towards
  restoring grasslands that can sustain their functions.

